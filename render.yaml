services:
  - type: web
    name: snack-museum
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start -- -p $PORT
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      # 数据持久化：后台改动通过 GitHub API 提交回仓库，
      # 免费套餐无持久磁盘时也不会在重启/部署后丢数据。
      - key: GITHUB_TOKEN
        sync: false
      - key: GITHUB_REPO
        value: zdtzn/snack-museum
      - key: GITHUB_BRANCH
        value: main
